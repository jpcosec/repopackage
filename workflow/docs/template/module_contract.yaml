# Repopackage Module Contract
module_name: "[nombre-del-modulo]"
version: "1.0.0"
description: "Breve descripción de la responsabilidad única del módulo."

# Contrato de Interfaz
interface:
  inputs:
    - name: "input_name"
      type: "datatype"
      description: "Descripción del campo"
  outputs:
    - name: "output_name"
      type: "datatype"
      description: "Descripción del resultado"

# Dependencias
dependencies:
  external_libs:
    - name: "lib_name"
      version: "spec"
  internal_modules:
    - "otro_modulo_id"

# Traits (Composición)
traits:
  - "[Pattern]"
  - "[Stack]"
  - "[Reliability]"

# Estado de Validación
validation:
  unit_tests: false
  contract_tests: false
  linting_passed: false
