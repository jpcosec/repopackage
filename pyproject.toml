[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopackage"
version = "0.1.0"
description = "Repository Package CLI and Workflow Management"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = ["repopackage"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
repopackage = ["cli/templates/*.jinja2"]
