[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repopackage"
version = "0.1.1"
description = "Recursive, Contract-Based Repository Composition."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "networkx>=3.0",
    "pygit2>=1.12.0",
    "ruamel.yaml>=0.17.0",
    "pydantic>=2.0.0",
    "semantic_version>=2.10.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
rp = "repopackage.cli.main:main"
repopackage = "repopackage.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
